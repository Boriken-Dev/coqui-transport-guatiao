[package]
name = "provider-python"
description = "A transport written in Python, loaded through guatiao's source of Python libraries and held to the transport kind's contract"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
publish = false

[dependencies]
coqui-transport-guatiao = { path = "../..", features = ["contract"] }
# A direct dependency so that build.rs learns where Cargo checked out guatiao, whose Python binding and source of
# Python libraries the test needs.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", features = ["provider", "load"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

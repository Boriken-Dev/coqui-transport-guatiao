[package]
name = "coqui-transport-guatiao"
version = "0.0.0-alpha.0"
description = "The transport guatiao kind: dial, listen and channels a transport written in any language guatiao hosts provides, and the macro that makes a coqui-transport transport such a provider"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-transport-guatiao"
homepage = "https://boriken-dev.github.io/coqui-transport-guatiao/"
keywords = ["transport", "guatiao", "plugin", "channel", "provider"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "__pycache__", "/examples/provider-python/"]
# Nothing is published until the owner chooses a release.
publish = false

[workspace]
members = [".", "examples/provider-python"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# `contract`: the suite every provider of the kind passes, and the host side it is written with.
contract = []
# `pipe`: the Windows named pipe and Unix domain socket transport as a provider, id `pipe`.
pipe = ["dep:coqui-transport-pipe", "guatiao/load"]
# `websocket`: the WebSocket transport as a provider, id `websocket`.
websocket = ["dep:coqui-transport-web", "coqui-transport-web/websocket", "dep:url", "guatiao/load"]

[dependencies]
# The kind, its provider derive and the value model. Alpha, by revision: every project building against the kind needs the same one.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", features = ["provider"] }
# The channel a connection is carried over: guatiao's own object kinds, at the same revision.
guatiao-channel = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e" }
# A settings type described by coqui-builder as a guatiao schema and value.
guatiao-builder = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e" }
# Describes the settings types and lists their non-default values. By revision, as the family pins it.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad", features = ["derive"] }
# The channel contract a transport implements. No guatiao in it, and none is added: this crate is where the two meet.
coqui-transport = { git = "https://github.com/Boriken-Dev/coqui-transport", rev = "1283116a22de6a8918faa3d0ebd78b8b6777ff0a", default-features = false }
coqui-transport-pipe = { git = "https://github.com/Boriken-Dev/coqui-transport-pipe", rev = "1bf161f4d9349e9821d384859d3acdfb58aeae94", features = ["channel"], optional = true }
coqui-transport-web = { git = "https://github.com/Boriken-Dev/coqui-transport-web", rev = "c8df84264ff8e60907f5cedf269104e91d5add22", optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", features = ["provider", "load"] }
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", features = ["json"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

# A real library the tests load: `cargo test` builds it into target/<profile>/examples.
[[example]]
name = "pipe_library"
crate-type = ["cdylib"]
required-features = ["pipe"]

[[test]]
name = "macro"
required-features = ["contract"]

[[test]]
name = "pipe"
required-features = ["pipe", "contract"]

[[test]]
name = "library"
required-features = ["pipe", "contract"]

[[test]]
name = "websocket"
required-features = ["websocket", "contract"]
